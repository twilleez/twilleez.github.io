<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elite Basketball Athlete Tracker</title><style>body{margin:0;background:#0b1020;color:#f6f8ff;font:15px system-ui}.w{max-width:760px;margin:auto;padding:18px 14px 80px}.c{background:#151c31;border:1px solid #2c3858;border-radius:16px;padding:14px;margin:12px 0}h1{font-size:25px;margin:5px 0}h2{font-size:18px}.muted{color:#aeb8d4}.weeks{display:flex;gap:7px;overflow:auto;padding:12px 0}.weeks button{background:#151c31;color:white;border:1px solid #2c3858;border-radius:99px;padding:10px 13px;white-space:nowrap}.weeks .on{background:#6ee7b7;color:#062116;font-weight:800}.ex{display:grid;grid-template-columns:28px 1fr 76px;gap:8px;align-items:center;border-top:1px solid #2c3858;padding:10px 0}.ex input[type=checkbox]{width:22px;height:22px}.dose,.sm{color:#aeb8d4;font-size:12px}.load,.m input{width:100%;background:#0b1020;color:white;border:1px solid #2c3858;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#1d2741;padding:9px;border-radius:10px}.m label{display:block;font-size:11px;color:#aeb8d4;margin-bottom:4px}.bar{height:10px;background:#1d2741;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#6ee7b7}.note{border-left:4px solid #fbbf24;background:#302812;padding:10px;border-radius:8px;color:#fff4c2}</style><div class="w"><h1>🏀 Elite Basketball Athlete</h1><div class="muted">8-week strength • vertical • speed • agility • reactive power • cardio</div><div class="weeks" id="weeks"></div><div class="c"><h2 id="phase"></h2><div class="muted" id="desc"></div><div class="bar"><i id="bar"></i></div><div class="sm" id="pct"></div></div><div id="days"></div><div class="c"><h2>📈 Weekly Progress</h2><div class="grid" id="metrics"></div></div><div class="c"><h2>Elite Progression Rule</h2><div class="note" id="rule"></div></div><div class="c"><h2>🏆 Week 1 → Week 8</h2><div id="compare" class="sm"></div></div></div><script>const P=[['Elite Foundation','Build advanced movement quality, aerobic base and baseline force/speed.','RPE 7–8. Clean landings, full sprint rest; cardio must not reduce explosive quality.'],['Foundation II','Raise output and aerobic capacity without losing movement quality.','Add small load only if Week 1 was clean; keep jump contacts controlled.'],['Power Build','Shift toward lower-rep strength, contrast power and basketball intervals.','Full recovery on jumps/sprints. Put conditioning after upper work, not before explosive sessions.'],['High Output','Hardest full-volume performance and conditioning week.','This is the conditioning peak. Do not add extra work beyond the plan.'],['Deload','Reduce fatigue and resensitize.','Cut hard volume and cardio about 35–40%; no hard intervals.'],['Explosive Conversion','Turn strength and fitness into repeatable game-speed power.','Short basketball intervals; protect max sprint and jump quality.'],['Peak Power','Highest quality with lower conditioning volume.','Keep conditioning sharp and brief. Stop explosive work if speed/jump quality falls.'],['Taper + Test','Reduce fatigue and measure adaptation.','Easy cardio only before testing; arrive fresh.']];const core={push:[['Med-ball chest pass','4×3'],['Bench press','4×3–5'],['Landmine/Push press','3×4–6'],['Incline DB press','3×6–8'],['Lateral raise','3×12'],['Triceps','2–3×10']],pull:[['Acceleration start','4×10 yd'],['Free sprint','3–5×15–20 yd'],['Trap-bar deadlift','4×2–4'],['Weighted pull-up','4×5–6'],['Row','3×6–8'],['Farmer carry','3×30 yd']],legs:[['Fast pogo','3×10–15'],['Countermovement jump','4×2'],['Broad jump','3×2'],['Approach jump 2-foot','4–6×1–2'],['Approach jump 1-foot','3–4×1–2/leg'],['Back squat','4×3–5'],['RDL','3×5–6'],['RFESS','3×5–6/leg'],['Soleus + tibialis','3×10–15']],rec:[['Easy walk/bike','20–30 min'],['Ankle/Achilles mobility-isometric','6–10 min'],['Hip/adductor mobility','8–10 min'],['Breathing / recovery','5 min']],upper:[['Rotational med-ball throw','4×3/side'],['Incline press','3×6–8'],['Pull-up/pulldown','3×6–8'],['DB shoulder press','3×8'],['Chest-supported row','3×8'],['Rear delt + lateral raise','3×12–15']],court:[['Flying/10–20 yd sprint','4–5 reps'],['Lateral bound → sprint','3–4×2–3/side'],['5-10-5 shuttle','3–4 timed reps'],['Reactive mirror drill','4–5×8 sec'],['Hesi → burst → finish','2–3 rounds'],['Retreat → re-attack','2–3 rounds'],['Hack squat','3×5–8'],['Hip thrust','3×5–8'],['Nordic/leg curl','3×4–8']],rest:[['Complete rest','Recover • hydrate • sleep']]};const cardio={1:[['Easy aerobic finisher','15–20 min after Day 1 • conversational pace'],['Zone 2 recovery cardio','25–30 min on Day 4']],2:[['Easy aerobic finisher','20 min after Day 1'],['Zone 2 recovery cardio','30–35 min on Day 4'],['Easy court tempo','6×30 sec / 60 sec easy after Day 5']],3:[['Easy aerobic finisher','15–20 min after Day 1'],['Zone 2 recovery cardio','25–30 min Day 4'],['Court intervals','8×15 sec hard / 45 sec recovery after Day 5']],4:[['Zone 2','20 min after Day 1'],['Recovery cardio','25 min Day 4'],['Court intervals','10×15 sec hard / 45 sec recovery after Day 5'],['Repeat-sprint conditioning','2 sets × 4×10 sec hard / 50 sec recovery • 3 min sets']],5:[['Easy bike/walk','15–20 min ×2 this week'],['No hard intervals','Deload conditioning']],6:[['Zone 2 maintenance','20–25 min Day 4'],['Basketball intervals','2 sets ×5×15 sec hard / 45 sec recovery • 3 min sets'],['Easy flush','10–15 min optional after Day 5']],7:[['Zone 2 maintenance','20 min Day 4'],['Game-speed intervals','2 sets ×4×15 sec hard / 45 sec recovery • 3 min sets'],['No extra conditioning after Day 6','Protect peak output']],8:[['Easy bike/walk','15–20 min early week'],['Optional recovery cardio','15 min very easy'],['No hard intervals before testing','Taper']]};function program(w){let d=JSON.parse(JSON.stringify(core));if(w==1){d.pull[1][1]='3×15 yd';d.legs[5][1]='4×5 @RPE 7–8';d.court[2][1]='3 reps @85–90%'}if(w==2){d.pull[0]=['3-point start','4×10 yd'];d.legs[5][1]='5×4 @RPE 8';d.court[2][1]='4 reps @90%'}if(w==3){d.pull[0]=['Resisted sprint','4×10 yd'];d.pull[1][1]='4×15 yd @95–100%';d.legs.splice(1,0,['Back squat → max jump','4 rounds: 3 reps → 2 jumps']);d.court[0]=['Flying 10','4 reps']}if(w==4){d.pull[1][1]='5×15 yd timed';d.legs[1]=['Low depth jump','4×2'];d.legs[5][1]='5×3 @RPE 8–8.5';d.court[2][1]='4 timed reps'}if(w==5){for(let k of Object.keys(d))d[k]=d[k].slice(0,Math.max(2,Math.ceil(d[k].length*.6)));d.pull[1]=['15 yd sprint','3 reps @90%'];d.legs[0]=['Pogo','2×10'];d.legs[1]=['CM jump','3×2 @85–90%']}if(w==6){d.pull[0]=['Resisted sprint','4×10 yd'];d.pull[1]=['Free sprint after resistance','4×15 yd'];d.legs.splice(1,0,['Squat → max vertical','4 rounds: 3 reps → 2 jumps']);d.court[0]=['Flying 10','5 reps'];d.court[3]=['Reactive mirror','5×8 sec']}if(w==7){d.pull[1]=['Free 15 yd sprint','4 timed reps'];d.legs[1]=['Low depth jump','4×2'];d.legs[5][1]='4×2–3 @RPE 8';d.court[2][1]='3–4 timed reps';d.court[4][1]='3 rounds competition speed'}let days;if(w==8)days=[['🟢 Day 1 — Primer',[['Med-ball chest pass','3×2'],['Bench','3×3 @RPE 6–7'],['Plyo push-up','3×2']]],['🔵 Day 2 — Speed Primer',[['10 yd start','3 reps @90–95%'],['15 yd sprint','2 reps @95%'],['Trap-bar deadlift','2×2 @RPE 6–7']]],['🔴 Day 3 — Jump Primer',[['Pogo','2×8'],['CM jump','3×1 @90–95%'],['Approach jump','3×1'],['Back squat','2×3 @RPE 6']]],['⚪ Day 4 — Recovery',[['Walk + mobility','20–30 min'],['No hard jumps/sprints','Full recovery']]],['🟠 Day 5 — TEST',[['Standing reach','3 measures'],['Standing vertical','3 attempts'],['2-foot approach vertical','3 attempts'],['1-foot approach vertical','3/leg'],['10-yard sprint','3 timed'],['5-10-5 shuttle','3 timed']]],['🟣 Day 6 — Light Basketball',[['Form shooting','20–30 min'],['Ball handling','10–15 min']]],['⚫ Day 7 — Rest',d.rest]];else days=[['🟢 Day 1 — Push + Upper Power',d.push],['🔵 Day 2 — Acceleration + Pull',d.pull],['🔴 Day 3 — Force + Vertical',d.legs],['⚪ Day 4 — Recovery',d.rec],['🟠 Day 5 — Upper Power/Hypertrophy',d.upper],['🟣 Day 6 — COD + Fast Switch',d.court],['⚫ Day 7 — Rest',d.rest]];days.splice(6,0,['❤️ Cardio — Week '+w,cardio[w]]);return days}let w=+(localStorage.getItem('eliteW')||1),K=x=>`elite_${w}_${x}`;const ms=[['weight','Body weight (lb)'],['sv','Standing vertical (in)'],['av','Approach vertical (in)'],['sprint','10-yard sprint (sec)'],['shuttle','5-10-5 (sec)'],['fresh','Leg freshness 1–5'],['knee','Knee discomfort 0–10'],['ach','Achilles discomfort 0–10'],['sleep','Sleep hours'],['ready','Readiness 1–5'],['cardio','Cardio minutes/week'],['crpe','Conditioning RPE 1–10'],['rhr','Resting HR optional']];function render(){weeks.innerHTML='';for(let i=1;i<=8;i++){let b=document.createElement('button');b.textContent='Week '+i;b.className=i==w?'on':'';b.onclick=()=>{w=i;localStorage.setItem('eliteW',i);render()};weeks.appendChild(b)}phase.textContent=`Week ${w}: ${P[w-1][0]}`;desc.textContent=P[w-1][1];rule.textContent=P[w-1][2];days.innerHTML='';program(w).forEach((D,di)=>{let c=document.createElement('div');c.className='c';c.innerHTML='<h2>'+D[0]+'</h2>';D[1].forEach((e,ei)=>{let id=`${di}_${ei}`,r=document.createElement('div');r.className='ex';r.innerHTML=`<input type=checkbox ${localStorage.getItem(K(id))=='1'?'checked':''}><div><b>${e[0]}</b><div class=dose>${e[1]}</div></div><input class=load placeholder="lb/time" value="${localStorage.getItem(K(id+'v'))||''}">`;r.children[0].onchange=x=>{localStorage.setItem(K(id),x.target.checked?'1':'0');prog()};r.children[2].oninput=x=>localStorage.setItem(K(id+'v'),x.target.value);c.appendChild(r)});days.appendChild(c)});metrics.innerHTML='';ms.forEach(m=>{let x=document.createElement('div');x.className='m';x.innerHTML=`<label>${m[1]}</label><input type=number step=.01 value="${localStorage.getItem(K('m'+m[0]))||''}">`;x.children[1].oninput=e=>{localStorage.setItem(K('m'+m[0]),e.target.value);cmp()};metrics.appendChild(x)});prog();cmp()}function prog(){let a=[...document.querySelectorAll('.ex input[type=checkbox]')],n=a.filter(x=>x.checked).length,p=a.length?Math.round(n/a.length*100):0;bar.style.width=p+'%';pct.textContent=`${n}/${a.length} complete • ${p}%`}function M(w,m){return localStorage.getItem(`elite_${w}_m${m}`)||'—'}function D(m,low=0){let a=+M(1,m),b=+M(8,m);if(!a||!b)return'—';let d=low?a-b:b-a;return(d>=0?'+':'')+d.toFixed(2)}function cmp(){compare.innerHTML=`Vertical: <b>${M(1,'sv')} → ${M(8,'sv')}</b> (${D('sv')}")<br>Approach: <b>${M(1,'av')} → ${M(8,'av')}</b> (${D('av')}")<br>10 yd: <b>${M(1,'sprint')} → ${M(8,'sprint')}</b> (${D('sprint',1)} sec gained)<br>5-10-5: <b>${M(1,'shuttle')} → ${M(8,'shuttle')}</b> (${D('shuttle',1)} sec gained)`}render();</script>
