<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Varsity Elite Basketball Workout</title><style>body{margin:0;background:#0b1020;color:#f6f8ff;font:15px system-ui}.w{max-width:780px;margin:auto;padding:18px 14px 80px}.c{background:#151c31;border:1px solid #2c3858;border-radius:16px;padding:14px;margin:12px 0}h1{font-size:25px;margin:5px 0}h2{font-size:18px}.muted,.dose,.sm{color:#aeb8d4}.weeks{display:flex;gap:7px;overflow:auto;padding:12px 0}.weeks button{background:#151c31;color:white;border:1px solid #2c3858;border-radius:99px;padding:10px 13px}.weeks .on{background:#6ee7b7;color:#062116;font-weight:800}.ex{display:grid;grid-template-columns:28px 1fr 76px;gap:8px;align-items:center;border-top:1px solid #2c3858;padding:10px 0}.ex input[type=checkbox]{width:22px;height:22px}.dose,.sm{font-size:12px}.load,.m input{width:100%;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #2c3858;border-radius:8px;padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.m{background:#1d2741;padding:9px;border-radius:10px}.m label{display:block;font-size:11px;color:#aeb8d4;margin-bottom:4px}.bar{height:10px;background:#1d2741;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#6ee7b7}.note{border-left:4px solid #fbbf24;background:#302812;padding:10px;border-radius:8px;color:#fff4c2}</style><div class="w"><h1>🏀 Varsity Elite Basketball Athlete</h1><div class="muted">8-week basketball strength • arms • vertical • speed • agility • conditioning</div><div class="weeks" id="weeks"></div><div class="c"><h2 id="phase"></h2><div class="muted" id="desc"></div><div class="bar"><i id="bar"></i></div><div class="sm" id="pct"></div></div><div id="days"></div><div class="c"><h2>📈 Weekly Progress</h2><div class="grid" id="metrics"></div></div><div class="c"><h2>🚦 Varsity Load Rule</h2><div class="note" id="rule"></div></div></div><script>const phases=[['Foundation','Build strength, landing skill, acceleration mechanics and aerobic base.'],['Build','Increase force and quality volume.'],['Power','Convert strength toward explosive basketball actions.'],['High Output','Highest productive workload; no junk volume.'],['Deload','Reduce volume about 35–40% while staying sharp.'],['Explosive Conversion','Maximum-quality speed, jumps and basketball transfer.'],['Peak','Lower volume; highest movement quality.'],['Taper + Test','Reduce fatigue and test performance.']];const base={mon:[['Med-ball chest pass','4×4'],['Bench press','3×5–6'],['Pull-up','3×6–8'],['1-arm DB bench','3×8/side'],['Chest-supported row','3×8'],['Half-kneeling landmine press','3×6/side'],['EZ-bar curl','3×8–10'],['Hammer curl','3×10–12'],['Close-grip bench','3×6–8'],['Rope pressdown','3×10–12'],['Overhead triceps extension','2×12–15'],['Cable curl','2×12–15'],['Farmer carry','3×30 yd'],['Split-stance cable rotation','3×6/side']],tue:[['Wall acceleration switch','2×5/leg'],['Falling start','3×10 yd'],['10-yard sprint','4 reps'],['15-yard acceleration','3 reps'],['Pogo','2×10'],['Countermovement jump','3×3'],['2-foot approach jump','4×2'],['1-foot approach jump','3×2/leg'],['Trap-bar deadlift','4×4'],['RFESS','3×6/leg'],['RDL','3×6'],['Soleus calf raise','3×10–12'],['Tibialis raise','3×15'],['Copenhagen plank','3×20–30 sec/side']],wed:[['Zone 2 bike/walk/elliptical','25–30 min'],['Ankle + foot prep','6–8 min'],['Hip/adductor/hamstring mobility','8–10 min'],['T-spine mobility','5 min'],['Optional light shooting','20–30 min']],thu:[['Fast pogo','3×10'],['Low depth jump','3×3'],['Lateral bound → vertical','3×3/side'],['Approach jump','4×2'],['Shuffle → sprint','3/side'],['Crossover → sprint','3/side'],['Retreat → re-attack','3/side'],['5-10-5 shuttle','3–4 reps'],['Reactive mirror','4×8–10 sec'],['Front squat','3×4'],['Hip thrust','3×5'],['Single-leg RDL','3×6/leg'],['Lateral lunge','3×6/side'],['Nordic curl','2–3×4–6']],fri:[['Rotational med-ball throw','4×3/side'],['Overhead med-ball throw','3×3'],['Push press','3×4'],['Incline DB press','3×8'],['Pull-up / pulldown','3×8'],['1-arm row','3×8'],['Face pull','3×12'],['Incline DB curl','3×10'],['Rope hammer curl','2×12'],['Skull crusher','3×10'],['Triceps pressdown','2×12–15'],['Farmer carry','3×30 yd'],['Basketball intervals','2 sets: 5×15 sec hard / 45 sec recovery • 3 min between sets']],sat:[['Hesitation → acceleration','3/side'],['Crossover → acceleration','3/side'],['Retreat → re-attack','3/side'],['Closeout → attack','3/side'],['Defensive slide → sprint','4 reps'],['Hard stop → change direction','3/side'],['1-foot finishes','8/side'],['2-foot power finishes','8/side'],['Veer/contact finishes','8/side'],['Catch-and-shoot','5 spots ×5 makes'],['Relocation 3s','20 makes'],['Pull-up jumpers','20 makes'],['Game-speed 3s','25 makes'],['Fatigue free throws','10 makes']],sun:[['Complete rest','Hydrate • fuel • sleep • recover']]};function plan(w){let d=JSON.parse(JSON.stringify(base));if(w==2){d.tue[8][1]='4×3–4 @RPE 8';d.thu[9][1]='4×4';d.fri[12][1]='2 sets: 6×15 sec / 45 sec'}if(w==3){d.tue[2][1]='5 timed reps';d.tue[8][1]='4×3';d.tue.splice(6,0,['Squat/Trap-bar → max jump contrast','3 rounds']);d.thu[1][1]='4×2';d.fri[12][1]='8×15 sec / 45 sec'}if(w==4){d.tue[3][1]='4 timed reps';d.tue[8][1]='5×3 @RPE 8–8.5';d.thu[7][1]='4 timed reps';d.fri[12][1]='10×15 sec / 45 sec'}if(w==5){Object.keys(d).forEach(k=>d[k]=d[k].slice(0,Math.max(1,Math.ceil(d[k].length*.65))));d.wed[0]=['Easy Zone 2','20 min'];d.fri.push(['No hard conditioning','Deload'])}if(w==6){d.tue[1]=['Resisted → free acceleration','4×10 yd + 4×15 yd'];d.tue[5]=['Max CM jump','4×2'];d.thu[7][1]='4 timed reps';d.fri[12][1]='2 sets: 5×15 sec / 45 sec'}if(w==7){d.tue[2][1]='4 timed reps';d.tue[5][1]='4×2 max quality';d.thu[1][1]='4×2';d.thu[7][1]='3 timed reps';d.fri[12][1]='2 sets: 4×15 sec / 45 sec'}if(w==8){d.mon=d.mon.slice(0,6).map(x=>[x[0],x[1].replace(/4×4|3×5–6|3×6–8|3×8/g,'2–3 easy sets')]);d.tue=[['10-yard sprint','3 timed attempts'],['Standing vertical','3 attempts'],['2-foot approach vertical','3 attempts'],['1-foot approach vertical','3/leg'],['Broad jump','3 attempts']];d.thu=[['5-10-5 shuttle','3 timed attempts'],['Flying 10','3 timed attempts'],['Mobility','15 min']];d.fri=[['Light upper primer','30–40 min @RPE 6'],['No hard conditioning','Taper']];d.sat=[['Light shooting + handles','30–45 min']]}return d}let w=+(localStorage.getItem('varsityW')||1),K=x=>`varsity_${w}_${x}`;const metrics=[['weight','Body weight'],['sv','Standing vertical'],['av','Approach vertical'],['sprint','10-yard sprint'],['shuttle','5-10-5'],['sleep','Sleep hours'],['ready','Readiness 1–5'],['practice','Varsity practice min'],['game','Game min'],['rpe','Basketball RPE 1–10']];function render(){weeks.innerHTML='';for(let i=1;i<=8;i++){let b=document.createElement('button');b.textContent='Week '+i;b.className=i==w?'on':'';b.onclick=()=>{w=i;localStorage.setItem('varsityW',i);render()};weeks.appendChild(b)}phase.textContent='Week '+w+': '+phases[w-1][0];desc.textContent=phases[w-1][1];rule.textContent='Speed and jumps come before fatigue. Full recovery between max efforts. If readiness ≤2/5, meaningful knee/Achilles pain is present, or varsity practice/game load is unusually high, remove extra conditioning and reduce explosive volume. Strength reps should be clean—no grinding.';let d=plan(w),days=[['Monday — Upper Strength + Arms + Basketball Strength',d.mon],['Tuesday — Acceleration + Lower Strength + Vertical',d.tue],['Wednesday — Recovery + Zone 2 + Mobility',d.wed],['Thursday — Reactive Speed + COD + Plyometrics + Lower Power',d.thu],['Friday — Upper Power + Total Body + Arms + Conditioning',d.fri],['Saturday — Basketball Athleticism + Skills + Game Conditioning',d.sat],['Sunday — Complete Rest',d.sun]];document.getElementById('days').innerHTML='';days.forEach((D,di)=>{let c=document.createElement('div');c.className='c';c.innerHTML='<h2>'+D[0]+'</h2>';D[1].forEach((e,ei)=>{let id=di+'_'+ei,r=document.createElement('div');r.className='ex';r.innerHTML=`<input type=checkbox ${localStorage.getItem(K(id))==='1'?'checked':''}><div><b>${e[0]}</b><div class=dose>${e[1]}</div></div><input class=load placeholder="lb/time" value="${localStorage.getItem(K(id+'v'))||''}">`;r.children[0].onchange=x=>{localStorage.setItem(K(id),x.target.checked?'1':'0');progress()};r.children[2].oninput=x=>localStorage.setItem(K(id+'v'),x.target.value);c.appendChild(r)});days.appendChild(c)});metricsEl.innerHTML='';metrics.forEach(m=>{let x=document.createElement('div');x.className='m';x.innerHTML=`<label>${m[1]}</label><input type=number step=.01 value="${localStorage.getItem(K('m'+m[0]))||''}">`;x.children[1].oninput=e=>localStorage.setItem(K('m'+m[0]),e.target.value);metricsEl.appendChild(x)});progress()}function progress(){let a=[...document.querySelectorAll('.ex input[type=checkbox]')],n=a.filter(x=>x.checked).length,p=a.length?Math.round(100*n/a.length):0;bar.style.width=p+'%';pct.textContent=n+'/'+a.length+' complete • '+p+'%'}const metricsEl=document.getElementById('metrics');render();</script>
