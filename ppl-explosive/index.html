<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Varsity Elite</title><style>*{box-sizing:border-box}:root{--b:#0a84ff;--g:#30d58a;--bg:#070b12;--p:#111722;--l:#273244;--m:#9ea9b8}body{margin:0;background:linear-gradient(#070b12,#0b111a);color:#f5f7fb;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:820px;margin:auto;padding:12px 10px 90px}.brand{display:flex;gap:10px;align-items:center;padding:8px 2px}h1{font-size:24px;margin:0}.sub,.target,.small{color:var(--m);font-size:13px}.weeks{display:flex;gap:8px;overflow:auto;padding:12px 0}.weeks button{min-width:50px;height:42px;border:1px solid var(--l);border-radius:22px;background:#121925;color:white}.weeks .on{background:var(--b);border-color:var(--b)}.phase,.exercise,.monitor{background:var(--p);border:1px solid var(--l);border-radius:20px}.phase,.monitor{padding:15px;margin:10px 0}.top{display:flex;justify-content:space-between;align-items:end}.bar{height:10px;background:#1e2735;border-radius:20px;overflow:hidden;margin:10px 0 5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--g))}.day{margin:22px 0}.day h2{font-size:21px;margin:0 2px 8px}.exercise{padding:14px;margin:10px 0}.head{display:grid;grid-template-columns:1fr 42px;gap:10px}.name{font-size:18px;font-weight:800}.complete{width:42px;height:42px;border-radius:50%;border:1px solid #455166;background:#111722;color:#9aa5b5;font-size:20px}.done{opacity:.72}.done .complete,.setdone.on{background:var(--g);border-color:var(--g);color:#062116}.done .name{text-decoration:line-through}.table{border:1px solid var(--l);border-radius:15px;overflow:hidden;margin-top:13px}.row{display:grid;grid-template-columns:34px 1fr 1fr 32px;gap:6px;align-items:center;padding:8px;border-top:1px solid var(--l)}.row:first-child{border:0}.hdr{background:#151d29;color:var(--m);font-size:11px;text-transform:uppercase}.row input{width:100%;min-width:0;height:42px;background:#0d141e;color:white;border:1px solid #334054;border-radius:9px;text-align:center;font-size:16px}.setdone{width:30px;height:30px;border-radius:50%;border:1px solid #465369;background:#141c28;color:#98a3b3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.actions button{min-height:44px;border-radius:12px;border:1px solid #344154;background:#182231;color:white;font-weight:700}.actions .primary{background:var(--b);border-color:var(--b)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.stat{background:#151d29;border-radius:13px;padding:9px;text-align:center}.stat small{display:block;color:var(--m);font-size:10px;text-transform:uppercase}.simple{margin-top:12px;display:grid;grid-template-columns:1fr 46px;gap:8px}.simple input{height:44px;background:#0d141e;color:white;border:1px solid #334054;border-radius:10px;padding:9px;font-size:16px}.simple button{border:0;border-radius:12px;background:#182231;color:white}.simple button.on{background:var(--g);color:#062116}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#151d29;padding:9px;border-radius:12px}.metric label{display:block;color:var(--m);font-size:11px}.metric input{width:100%;height:40px;background:#0d141e;color:white;border:1px solid #334054;border-radius:8px;margin-top:4px;padding:7px}.rule{margin-top:12px;border-left:4px solid #ffd60a;background:#2b2609;color:#fff6b7;padding:10px;border-radius:9px;font-size:13px}@media(max-width:520px){.grid{grid-template-columns:1fr}.row{grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 30px;padding:7px 5px;gap:4px}}</style><div class="app"><div class="brand"><div style="font-size:30px">🏀</div><div><h1>Varsity Elite</h1><div class="sub">Basketball Performance</div></div></div><div class="weeks" id="weeks"></div><div class="phase"><div class="top"><div><b id="phase"></b><div class="small">Basketball performance progression</div></div><b id="pct">0%</b></div><div class="bar"><i id="bar"></i></div><div class="small" id="count"></div></div><main id="days"></main><div class="monitor"><h2>Weekly Monitoring</h2><div class="grid" id="metrics"></div><div class="rule">Hard varsity practice/game replaces similar conditioning. Reduce explosive volume when legs are not fresh or joint/tendon pain rises.</div></div></div><script>const P=['Foundation','Build','Power','High Output','Deload','Explosive Conversion','Peak','Taper + Test'];const B={mon:[['Med-ball chest pass','3×4'],['Bench press','3×5–6'],['Pull-up','3×6–8'],['1-arm DB bench','2×8/side'],['Chest-supported row','3×8'],['Landmine press','2×6/side'],['EZ-bar curl','3×8–10'],['Hammer curl','2×10–12'],['Close-grip bench','3×6–8'],['Rope pressdown','2×10–12'],['Farmer carry','2×30 yd'],['Pallof press','2×8/side']],tue:[['Dynamic sprint warm-up','8–10 min'],['Wall acceleration switch','2×5/leg'],['10-yard acceleration','4 reps'],['15-yard acceleration','3 reps'],['Pogo','2×10'],['Countermovement jump','3×3'],['2-foot approach jump','3×2'],['1-foot approach jump','2×2/leg'],['Trap-bar deadlift','4×4 @RPE 7–8'],['RFESS','3×6/leg'],['RDL','3×6'],['Soleus calf raise','3×10–12'],['Tibialis raise','2×15'],['Copenhagen plank','2×20–30 sec/side']],wed:[['Zone 2 cardio','20–30 min'],['Ankle + foot mobility/isometrics','8 min'],['Hip + adductor mobility','8 min'],['T-spine mobility','5 min'],['Optional easy shooting','20–30 min']],thu:[['Dynamic court warm-up','8–10 min'],['Snap-down / stick landing','2×4'],['Lateral bound + stick','3×3/side'],['Approach jump','3×2'],['5-yard acceleration → controlled stop','3/side'],['Shuffle → sprint','3/side'],['Crossover → sprint','3/side'],['5-10-5 shuttle','3 reps'],['Reactive mirror','3×8 sec'],['Front squat','3×4 @RPE 7–8'],['Hip thrust','3×5'],['Single-leg RDL','2×6/leg'],['Lateral lunge','2×6/side'],['Nordic curl','2×4–6']],fri:[['Rotational med-ball throw','3×3/side'],['Push press','3×4'],['Incline DB press','3×8'],['Pull-up / pulldown','3×8'],['1-arm row','3×8'],['Face pull','2×12–15'],['Incline DB curl','3×10'],['Rope hammer curl','2×12'],['Skull crusher','3×10'],['Triceps pressdown','2×12'],['Basketball intervals','2×4×15 sec']],sat:[['Hesitation → acceleration','3/side'],['Crossover → acceleration','3/side'],['Retreat → re-attack','3/side'],['Closeout → attack','3/side'],['Defensive slide → sprint','3 reps'],['1-foot finishes','6/side'],['2-foot power finishes','6/side'],['Veer/contact finishes','6/side'],['Catch-and-shoot','20 makes'],['Relocation 3s','15 makes'],['Pull-up jumpers','15 makes'],['Game-speed 3s','20 makes'],['Live play / advantage drill','15–25 min'],['Pressure free throws','10 makes']],sun:[['Complete rest','Recover']]};let w=+(localStorage.getItem('varsityW')||1);const K=x=>`ve4_${w}_${x}`;function type(n){n=n.toLowerCase();if(/bench|press|pull-up|pulldown|row|curl|deadlift|rfess|rdl|squat|thrust|lunge|nordic|calf|tibialis/.test(n))return'load';if(/sprint|acceleration|shuttle|flying/.test(n))return'time';if(/jump|bound/.test(n))return'jump';if(/shoot|finish|free throw/.test(n))return'makes';if(/cardio|warm-up|mobility|isometric|mirror|interval|live play/.test(n))return'duration';return'simple'}function ns(t){let m=t.match(/(\d+)\s*×/);return m?Math.min(6,+m[1]):1}function card(e,di,ei){let id=`${di}_${ei}`,c=document.createElement('article'),ty=type(e[0]),done=localStorage.getItem(K(id+'c'))==='1';c.className='exercise'+(done?' done':'');c.innerHTML=`<div class="head"><div><div class="name">${e[0]}</div><div class="target">Target: ${e[1]}</div></div><button class="complete">${done?'✓':'○'}</button></div><div class="body"></div>`;let body=c.querySelector('.body');if(ty==='load'){let s=JSON.parse(localStorage.getItem(K(id+'s'))||'null')||Array.from({length:ns(e[1])},()=>({w:'',r:'',d:0}));body.innerHTML='<div class="table"><div class="row hdr"><span>Set</span><span>Weight</span><span>Reps</span><span>✓</span></div><div class="rows"></div></div><div class="actions"><button class="add">＋ Add Set</button><button class="primary fin">'+(done?'Completed':'Complete')+'</button></div><div class="stats"><div class="stat"><small>Avg Weight</small><b class="aw">—</b></div><div class="stat"><small>Avg Reps</small><b class="ar">—</b></div><div class="stat"><small>Total Reps</small><b class="tr">—</b></div><div class="stat"><small>Volume</small><b class="vol">—</b></div></div>';let rows=body.querySelector('.rows');function stat(){let entered=s.filter(x=>String(x.w).trim()||String(x.r).trim()),ws=entered.filter(x=>+x.w>0),rs=entered.filter(x=>+x.r>0),reps=rs.reduce((q,x)=>q+(+x.r),0),vol=entered.reduce((q,x)=>q+(+x.r||0)*(+x.w||0),0),aw=ws.length?ws.reduce((q,x)=>q+(+x.w),0)/ws.length:0,ar=rs.length?reps/rs.length:0;body.querySelector('.aw').textContent=aw?aw.toFixed(1)+' lb':'—';body.querySelector('.ar').textContent=ar?ar.toFixed(1):'—';body.querySelector('.tr').textContent=reps||'—';body.querySelector('.vol').textContent=vol?Math.round(vol).toLocaleString()+' lb':'—'}function save(){localStorage.setItem(K(id+'s'),JSON.stringify(s));stat()}function rr(){rows.innerHTML='';s.forEach((x,i)=>{let r=document.createElement('div');r.className='row';r.innerHTML=`<b>${i+1}</b><input inputmode=decimal placeholder="lb" value="${x.w}"><input inputmode=numeric placeholder="reps" value="${x.r}"><button class="setdone ${x.d?'on':''}">${x.d?'✓':'○'}</button>`;let a=r.querySelectorAll('input');a[0].oninput=z=>{x.w=z.target.value;save()};a[1].oninput=z=>{x.r=z.target.value;save()};r.querySelector('button').onclick=()=>{x.d=!x.d;save();rr()};rows.appendChild(r)});stat()}body.querySelector('.add').onclick=()=>{s.push({w:'',r:'',d:0});save();rr()};body.querySelector('.fin').onclick=()=>toggle();rr();function syncSets(){if(done){s.forEach(x=>{if(String(x.w).trim()||String(x.r).trim())x.d=1});save();rr()}}c._syncSets=syncSets}else{let label=ty==='time'?'BEST TIME / RESULT':ty==='jump'?'BEST HEIGHT / DISTANCE':ty==='makes'?'MAKES / ATTEMPTS':ty==='duration'?'TIME / RESULT':'RESULT / NOTES';body.innerHTML=`<div class="simple"><input placeholder="${label}" value="${localStorage.getItem(K(id+'v'))||''}"><button class="${done?'on':''}">${done?'✓':'○'}</button></div>`;body.querySelector('input').oninput=z=>localStorage.setItem(K(id+'v'),z.target.value);body.querySelector('button').onclick=()=>toggle()}function toggle(){done=!done;localStorage.setItem(K(id+'c'),done?'1':'0');c.classList.toggle('done',done);c.querySelector('.complete').textContent=done?'✓':'○';let fin=c.querySelector('.fin');if(fin)fin.textContent=done?'Completed':'Complete';if(c._syncSets)c._syncSets();let b=c.querySelector('.simple button');if(b){b.classList.toggle('on',done);b.textContent=done?'✓':'○'}progress()}c.querySelector('.complete').onclick=toggle;return c}function render(){weeks.innerHTML='';for(let i=1;i<=8;i++){let b=document.createElement('button');b.textContent='W'+i;b.className=i==w?'on':'';b.onclick=()=>{w=i;localStorage.setItem('varsityW',i);render()};weeks.appendChild(b)}phase.textContent='Week '+w+': '+P[w-1];let L=[['Monday — Upper Strength + Arms',B.mon],['Tuesday — Acceleration + Vertical + Lower Strength',B.tue],['Wednesday — Recovery',B.wed],['Thursday — Deceleration + Reactive COD + Lower Power',B.thu],['Friday — Upper Power + Arms + Conditioning',B.fri],['Saturday — Basketball Athleticism + Skill Transfer',B.sat],['Sunday — Complete Rest',B.sun]];days.innerHTML='';L.forEach((d,di)=>{let x=document.createElement('section');x.className='day';x.innerHTML='<h2>'+d[0]+'</h2>';d[1].forEach((e,ei)=>x.appendChild(card(e,di,ei)));days.appendChild(x)});metrics.innerHTML='';[['Sleep hours','sleep'],['Readiness 1–5','ready'],['Leg freshness 1–5','fresh'],['Practice min','practice'],['Game min','game'],['Knee pain 0–10','knee'],['Achilles pain 0–10','ach']].forEach(m=>{let x=document.createElement('div');x.className='metric';x.innerHTML=`<label>${m[0]}</label><input type=number value="${localStorage.getItem(K(m[1]))||''}">`;x.querySelector('input').oninput=z=>localStorage.setItem(K(m[1]),z.target.value);metrics.appendChild(x)});progress()}function progress(){let a=[...document.querySelectorAll('.exercise')],n=a.filter(x=>x.classList.contains('done')).length,p=a.length?Math.round(n/a.length*100):0;bar.style.width=p+'%';pct.textContent=p+'%';count.textContent=n+' of '+a.length+' exercises complete'}render();</script>
