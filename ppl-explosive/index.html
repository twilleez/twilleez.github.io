<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Varsity Elite</title><style>:root{--bg:#070b12;--p:#111722;--p2:#171f2c;--ln:#273244;--tx:#f5f7fb;--mu:#9ea9b8;--b:#0a84ff;--g:#30d58a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070b12,#0b111a);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;line-height:1.35}.app{max-width:820px;margin:auto;padding:14px 12px 95px}.brand{display:flex;gap:10px;align-items:center;padding:8px 2px}.ball{font-size:30px}h1{font-size:25px;margin:0;letter-spacing:-.02em}.sub,.small,.target{color:var(--mu)}.sub{font-size:14px}.weeks{display:flex;gap:8px;overflow:auto;padding:12px 0 5px;scrollbar-width:none}.weeks button{min-width:50px;min-height:42px;border:1px solid var(--ln);border-radius:22px;background:#121925;color:#fff}.weeks .on{background:var(--b);border-color:var(--b);font-weight:800}.phase,.exercise,.monitor{background:rgba(17,23,34,.95);border:1px solid var(--ln);border-radius:20px}.phase{padding:15px;margin:12px 0}.phaseTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.phase h2,.day h2,.monitor h2{margin:0}.big{font-size:22px;font-weight:800}.bar{height:10px;background:#1e2735;border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--g))}.day{margin:18px 0 24px}.dayHead{padding:0 2px 8px}.dayHead h2{font-size:21px}.exercise{padding:14px;margin:10px 0}.exHead{display:grid;grid-template-columns:1fr auto;gap:10px}.name{font-size:18px;font-weight:800}.target{font-size:13px;margin-top:3px}.complete{width:42px;height:42px;border-radius:50%;border:1px solid #455166;background:#111722;color:#8d98a8;font-size:20px}.exercise.done{opacity:.72}.exercise.done .complete,.setDone.on{background:var(--g);border-color:var(--g);color:#062116}.exercise.done .name{text-decoration:line-through}.table{margin-top:14px;border:1px solid var(--ln);border-radius:16px;overflow:hidden}.thead,.set{display:grid;grid-template-columns:36px 1fr 1fr 34px;gap:6px;align-items:center;padding:9px}.thead{background:#151d29;color:var(--mu);font-size:11px;text-transform:uppercase}.set{background:#0d131d;border-top:1px solid var(--ln)}.num{text-align:center;font-weight:800}.set input,.metric input{width:100%;min-width:0;min-height:42px;background:#111a27;color:#fff;border:1px solid #334054;border-radius:10px;padding:8px;text-align:center;font-size:16px}.setDone{width:30px;height:30px;border-radius:50%;border:1px solid #465369;background:#141c28;color:#98a3b3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.actions button{min-height:44px;border-radius:13px;border:1px solid #344154;background:#182231;color:#fff;font-weight:700}.actions .primary{background:var(--b);border-color:var(--b)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.stat{background:#151d29;border:1px solid #243043;border-radius:14px;padding:10px 8px;text-align:center}.stat label{display:block;font-size:10px;color:var(--mu);text-transform:uppercase}.stat b{display:block;font-size:16px;margin-top:3px}.monitor{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.metric{background:#151d29;border-radius:13px;padding:10px}.metric label{display:block;color:var(--mu);font-size:11px;margin-bottom:5px}.metric input{text-align:left}.rule{margin-top:12px;border-left:4px solid #ffd60a;background:#2b2609;color:#fff6b7;border-radius:10px;padding:11px;font-size:13px}@media(max-width:560px){.app{padding:10px 10px 85px}h1{font-size:23px}.exercise{padding:13px 11px}.thead,.set{grid-template-columns:32px minmax(0,1fr) minmax(0,1fr) 30px;padding:8px 7px;gap:5px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style><div class="app"><div class="brand"><div class="ball">🏀</div><div><h1>Varsity Elite</h1><div class="sub">Basketball Performance</div></div></div><div class="weeks" id="weeks"></div><section class="phase"><div class="phaseTop"><div><h2 id="phase"></h2><div class="small" id="desc"></div></div><div class="big" id="pct">0%</div></div><div class="bar"><i id="bar"></i></div><div class="small" id="count"></div></section><main id="days"></main><section class="monitor"><h2>Weekly Monitoring</h2><div class="grid" id="metrics"></div><div class="rule" id="rule"></div></section></div><script>const P=[['Foundation','Own landing, braking, acceleration and lifting technique.'],['Build','Increase force while keeping jump and sprint quality high.'],['Power','Convert strength to basketball speed and explosiveness.'],['High Output','Highest quality workload; avoid unnecessary volume.'],['Deload','Cut volume ~35–40%; keep movement fast and crisp.'],['Explosive Conversion','Max-quality acceleration, reactive movement and approach jumping.'],['Peak','Lower volume, high intent, full recovery.'],['Taper + Test','Freshen up and test basketball-relevant performance.']];const B={mon:[['Med-ball chest pass','3×4'],['Bench press','3×5–6'],['Pull-up','3×6–8'],['1-arm DB bench','2×8/side'],['Chest-supported row','3×8'],['Landmine press','2×6/side'],['EZ-bar curl','3×8–10'],['Hammer curl','2×10–12'],['Close-grip bench','3×6–8'],['Rope pressdown','2×10–12'],['Farmer carry','2×30 yd'],['Pallof press','2×8/side']],tue:[['Dynamic sprint warm-up','8–10 min'],['Wall acceleration switch','2×5/leg'],['10-yard acceleration','4 reps'],['15-yard acceleration','3 reps'],['Pogo','2×10'],['Countermovement jump','3×3'],['2-foot approach jump','3×2'],['1-foot approach jump','2×2/leg'],['Trap-bar deadlift','4×4 @RPE 7–8'],['RFESS','3×6/leg'],['RDL','3×6'],['Soleus calf raise','3×10–12'],['Tibialis raise','2×15'],['Copenhagen plank','2×20–30 sec/side']],wed:[['Zone 2 cardio','20–30 min'],['Ankle + foot mobility/isometrics','8 min'],['Hip + adductor mobility','8 min'],['T-spine mobility','5 min'],['Optional easy shooting','20–30 min']],thu:[['Dynamic court warm-up','8–10 min'],['Snap-down / stick landing','2×4'],['Lateral bound + stick','3×3/side'],['Approach jump','3×2'],['5-yard acceleration → controlled stop','3/side'],['Shuffle → sprint','3/side'],['Crossover → sprint','3/side'],['5-10-5 shuttle','3 reps'],['Reactive mirror','3×8 sec'],['Front squat','3×4 @RPE 7–8'],['Hip thrust','3×5'],['Single-leg RDL','2×6/leg'],['Lateral lunge','2×6/side'],['Nordic curl','2×4–6']],fri:[['Rotational med-ball throw','3×3/side'],['Push press','3×4'],['Incline DB press','3×8'],['Pull-up / pulldown','3×8'],['1-arm row','3×8'],['Face pull','2×12–15'],['Incline DB curl','3×10'],['Rope hammer curl','2×12'],['Skull crusher','3×10'],['Triceps pressdown','2×12'],['Basketball intervals','2×4×15 sec']],sat:[['Hesitation → acceleration','3/side'],['Crossover → acceleration','3/side'],['Retreat → re-attack','3/side'],['Closeout → attack','3/side'],['Defensive slide → sprint','3 reps'],['1-foot finishes','6/side'],['2-foot power finishes','6/side'],['Veer/contact finishes','6/side'],['Catch-and-shoot','20 makes'],['Relocation 3s','15 makes'],['Pull-up jumpers','15 makes'],['Game-speed 3s','20 makes'],['Live play / advantage drill','15–25 min'],['Pressure free throws','10 makes']],sun:[['Complete rest','Recover']]};function plan(w){let d=JSON.parse(JSON.stringify(B));if(w==2){d.tue[8][1]='4×4 @RPE 8';d.thu[9][1]='4×4 @RPE 8'}if(w==3){d.tue[2][1]='5 timed reps';d.tue[8][1]='4×3 @RPE 8';d.fri[10][1]='2×5×15 sec'}if(w==4){d.tue[3][1]='4 timed reps';d.tue[8][1]='5×3 @RPE 8–8.5';d.thu[7][1]='4 timed reps'}if(w==5){for(const k of ['mon','tue','thu','fri','sat'])d[k]=d[k].filter((x,i)=>i%3!==2);d.wed[0]=['Easy Zone 2','20 min']}if(w==6){d.tue[2]=['Resisted → free 10-yard acceleration','3 pairs'];d.tue[5]=['Max CM jump','4×2']}if(w==7){d.tue[2][1]='4 timed reps';d.tue[5][1]='3×2 max quality'}if(w==8){d.mon=[['Bench press','2×3 @RPE 6–7'],['Pull-up','2×5'],['EZ-bar curl','2×8'],['Rope pressdown','2×8']];d.tue=[['10-yard sprint','3 attempts'],['Standing vertical','3 attempts'],['2-foot approach vertical','3 attempts'],['1-foot approach vertical','3/leg'],['Broad jump','3 attempts']];d.wed=[['Recovery + mobility','20–30 min']];d.thu=[['5-10-5 shuttle','3 attempts'],['Flying 10','3 attempts']];d.fri=[['Upper primer','20–30 min @RPE 6']];d.sat=[['Light skill work','30–45 min']]}return d}let w=+(localStorage.getItem('varsityW')||1);const key=id=>`varsity3_${w}_${id}`,weeks=document.getElementById('weeks'),days=document.getElementById('days'),metrics=document.getElementById('metrics'),phase=document.getElementById('phase'),desc=document.getElementById('desc'),bar=document.getElementById('bar'),pct=document.getElementById('pct'),count=document.getElementById('count'),rule=document.getElementById('rule');const M=[['weight','Body weight'],['sv','Standing vertical'],['av','Approach vertical'],['sprint','10-yard sprint'],['shuttle','5-10-5'],['sleep','Sleep hours'],['ready','Readiness 1–5'],['fresh','Leg freshness 1–5'],['practice','Varsity practice min'],['game','Game min'],['rpe','Basketball RPE 1–10'],['knee','Knee pain 0–10'],['ach','Achilles pain 0–10']];function nsets(t){let m=String(t).match(/(\d+)\s*[×x]/);return m?Math.max(1,Math.min(6,+m[1])):1}function sets(id,t){let r=localStorage.getItem(key(id+'sets'));if(r)try{return JSON.parse(r)}catch(e){}return Array.from({length:nsets(t)},()=>({reps:'',weight:'',done:false}))}function save(id,s){localStorage.setItem(key(id+'sets'),JSON.stringify(s))}function stats(s){let v=s.filter(x=>x.done&&+x.reps>0),tr=v.reduce((a,x)=>a+(+x.reps||0),0),vol=v.reduce((a,x)=>a+(+x.reps||0)*(+x.weight||0),0);return{tr,vol,aw:tr?vol/tr:0,ar:v.length?tr/v.length:0}}function card(e,di,ei){let id=`d${di}e${ei}`,c=document.createElement('article'),done=localStorage.getItem(key(id+'c'))==='1',s=sets(id,e[1]);c.className='exercise'+(done?' done':'');c.innerHTML=`<div class="exHead"><div><div class="name">${e[0]}</div><div class="target">Target: ${e[1]}</div></div><button class="complete">${done?'✓':'○'}</button></div><div class="table"><div class="thead"><span>Set</span><span>Weight</span><span>Reps</span><span>✓</span></div><div class="rows"></div></div><div class="actions"><button class="add">＋ Add Set</button><button class="primary finish">${done?'Completed':'Complete Exercise'}</button></div><div class="stats"><div class="stat"><label>Avg Weight</label><b class="aw">—</b></div><div class="stat"><label>Avg Reps</label><b class="ar">—</b></div><div class="stat"><label>Total Reps</label><b class="tr">—</b></div><div class="stat"><label>Volume</label><b class="vol">—</b></div></div>`;let rows=c.querySelector('.rows');function rr(){rows.innerHTML='';s.forEach((x,i)=>{let r=document.createElement('div');r.className='set';r.innerHTML=`<div class="num">${i+1}</div><input inputmode="decimal" placeholder="lb" value="${x.weight}"><input inputmode="numeric" placeholder="reps" value="${x.reps}"><button class="setDone ${x.done?'on':''}">${x.done?'✓':'○'}</button>`;let ins=r.querySelectorAll('input');ins[0].oninput=e=>{s[i].weight=e.target.value;save(id,s);rs()};ins[1].oninput=e=>{s[i].reps=e.target.value;save(id,s);rs()};r.querySelector('button').onclick=()=>{s[i].done=!s[i].done;save(id,s);rr();rs()};rows.appendChild(r)})}function rs(){let q=stats(s);c.querySelector('.aw').textContent=q.aw?q.aw.toFixed(1)+' lb':'—';c.querySelector('.ar').textContent=q.ar?q.ar.toFixed(1):'—';c.querySelector('.tr').textContent=q.tr||'—';c.querySelector('.vol').textContent=q.vol?Math.round(q.vol).toLocaleString()+' lb':'—'}function toggle(){done=!done;localStorage.setItem(key(id+'c'),done?'1':'0');c.classList.toggle('done',done);c.querySelector('.complete').textContent=done?'✓':'○';c.querySelector('.finish').textContent=done?'Completed':'Complete Exercise';progress()}c.querySelector('.complete').onclick=toggle;c.querySelector('.finish').onclick=toggle;c.querySelector('.add').onclick=()=>{s.push({reps:'',weight:'',done:false});save(id,s);rr();rs()};rr();rs();return c}function render(){weeks.innerHTML='';for(let i=1;i<=8;i++){let b=document.createElement('button');b.textContent='W'+i;b.className=i==w?'on':'';b.onclick=()=>{w=i;localStorage.setItem('varsityW',i);render()};weeks.appendChild(b)}phase.textContent='Week '+w+': '+P[w-1][0];desc.textContent=P[w-1][1];rule.textContent='GREEN: readiness/freshness 4–5 and pain ≤2 → full plan. YELLOW: readiness/freshness 3, poor sleep, or pain 3–4 → reduce jump/sprint volume 20–30% and skip extra conditioning. RED: readiness/freshness ≤2 or pain ≥5 → no maximal sprint/jump work. Hard varsity practice/game replaces similar conditioning.';let d=plan(w),L=[['Monday','Upper Strength + Arms',d.mon],['Tuesday','Acceleration + Vertical + Lower Strength',d.tue],['Wednesday','Recovery',d.wed],['Thursday','Deceleration + Reactive COD + Lower Power',d.thu],['Friday','Upper Power + Arms + Conditioning',d.fri],['Saturday','Basketball Athleticism + Skill Transfer',d.sat],['Sunday','Complete Rest',d.sun]];days.innerHTML='';L.forEach((D,di)=>{let sec=document.createElement('section');sec.className='day';sec.innerHTML=`<div class="dayHead"><h2>${D[0]}</h2><div class="small">${D[1]}</div></div>`;D[2].forEach((e,ei)=>sec.appendChild(card(e,di,ei)));days.appendChild(sec)});metrics.innerHTML='';M.forEach(m=>{let x=document.createElement('div');x.className='metric';x.innerHTML=`<label>${m[1]}</label><input type="number" step=".01" value="${localStorage.getItem(key('m'+m[0]))||''}">`;x.querySelector('input').oninput=e=>localStorage.setItem(key('m'+m[0]),e.target.value);metrics.appendChild(x)});progress()}function progress(){let a=[...document.querySelectorAll('.exercise')],n=a.filter(x=>x.classList.contains('done')).length,p=a.length?Math.round(n/a.length*100):0;bar.style.width=p+'%';pct.textContent=p+'%';count.textContent=n+' of '+a.length+' exercises completed'}render();</script>
